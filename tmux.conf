# The tmux server of PingScope's ping session (tmux -L pingscope), apart from
# the user's own: no status line, so the attached terminal shows the shell alone.
set -g status off
set -g escape-time 0
set -g history-limit 10000
# The wheel scrolls back through the replies; a selection is copied to the
# clipboard through the terminal.
set -g mouse on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
